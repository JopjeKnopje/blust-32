[package]
name = "blust-32"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 2
debug = 2

[dependencies]
embedded-hal = "1.0"
nb = "1"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
# Panic behaviour, see https://crates.io/keywords/panic-impl for alternatives
# panic-halt = "1.0.0"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = "1.0.0"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
display-interface = "0.5.0"

[dependencies.stm32f1xx-hal]
version = "0.11.0"
features = ["stm32f103", "high"]
